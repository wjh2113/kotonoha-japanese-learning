name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install & test web
        run: |
          npm ci
          npm test
          npm run build

      - name: Sync Capacitor Android
        run: ./node_modules/.bin/cap sync android

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build debug APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000
        run: |
          set -euo pipefail
          chmod +x gradlew
          # GitHub 偶发 504 拉 gradle-distributions，重试几次
          for i in 1 2 3 4 5; do
            if ./gradlew assembleDebug --no-daemon --stacktrace; then
              exit 0
            fi
            echo "gradle assembleDebug attempt ${i} failed; retry in $((i * 8))s"
            sleep $((i * 8))
          done
          exit 1

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/kotonoha-debug.apk
          ls -lh artifacts/kotonoha-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-android-apk
          path: artifacts/kotonoha-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 言の葉 Android APK #${{ github.run_number }}
          body: |
            安装包：`kotonoha-debug.apk`
            - 包名：`cn.aidigitcloud.kotonoha`
            - 需允许「未知来源」安装
            - 联网后同步词库/课文；界面资源已打进 APK，断网也能打开已缓存内容
            - 访问密码与网页版相同
          files: artifacts/kotonoha-debug.apk
          generate_release_notes: true
