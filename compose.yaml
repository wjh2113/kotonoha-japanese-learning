services:
  postgres:
    image: postgres:18-alpine
    container_name: kotonoha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kotonoha
      POSTGRES_USER: kotonoha_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - kotonoha_postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kotonoha_app -d kotonoha"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kotonoha_postgres_data:
